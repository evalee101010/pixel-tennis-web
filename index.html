<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Tennis</title>
    <link rel="stylesheet" href="./styles.css?v=portrait-1" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="game" width="540" height="960" aria-label="Pixel Tennis"></canvas>
      <input
        id="room-code-native-input"
        type="text"
        aria-label="Room code"
        autocomplete="off"
        autocapitalize="characters"
        autocorrect="off"
        enterkeyhint="go"
        spellcheck="false"
        inputmode="text"
        maxlength="8"
      />
    </main>
    <script src="./game.js?v=demon-characters-1"></script>
  </body>
</html>
